[workspace]
members = ["crates/ism-core", "crates/ism-server"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.94"
version = "0.1.0"

# One dependency per line, alphabetical. Crates use `name.workspace = true`.
[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ism-core = { path = "crates/ism-core" }
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls", "chrono"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = "0.29.0"
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "limit", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"

[profile.dev]
debug = 0
incremental = false

# Apple's linker can misalign SQLx's proc-macro string pool when stripping it.
# Keep its symbol table without enabling debug info; test inherits this override.
[profile.dev.package.sqlx-macros]
strip = "none"

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = true
