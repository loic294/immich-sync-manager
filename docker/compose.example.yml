# Immich Sync Manager: example Docker Compose file (Synology NAS, Linux or Docker Desktop on Windows).
#
#   1. Copy this file next to your Immich compose file and edit the lines marked CHANGE ME.
#   2. Create the data folder and give it to the user in "user:" below.
#   3. `docker compose up -d`, then open http://<host>:8080 and create the administrator.
# Full guide: docs/install.md.

services:
  ism:
    # Build locally from a checkout (or replace with an image you published yourself).
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: immich-sync-manager:local
    container_name: immich-sync-manager
    restart: unless-stopped

    # CHANGE ME: the "uid:gid" that owns your external-library folders (`id <user>` over SSH).
    # Immich must also be able to read the files ISM writes, so use the same owner as the library.
    user: "1000:1000"

    ports:
      # The admin UI, the client API (Open Photo Manager, Immich local app) and the peer API.
      # To expose it only on a private interface, prefix its IP (example: "192.0.2.10:8080:8080").
      - "8080:8080"

    volumes:
      # CHANGE ME: every library folder Immich imports, mounted under /mnt. The paths do not need to
      # match Immich's: the Mappings page links each folder to its Immich import path.
      - /example/photos:/mnt/photos
      # Database and encryption key. Must be writable by the user above.
      - ./ism-data:/data

    environment:
      # CHANGE ME: your time zone (used for allowed sync hours unless a schedule sets its own).
      TZ: UTC
      # Set to "true" when the UI is served over HTTPS (reverse proxy).
      # ISM_SECURE_COOKIES: "true"
      # ISM_LOG: info

    # Optional: join Immich's network so the server can reach Immich's PostgreSQL for the few
    # writes the Immich API cannot do (see docs/immich-compatibility.md). Leave the database URL
    # empty in the UI to stay API-only.
    # networks: [immich]

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

